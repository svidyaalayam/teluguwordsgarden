services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vocabulary}
      POSTGRES_USER: ${POSTGRES_USER:-vocabulary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocabularychangeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vocabulary} -d ${POSTGRES_DB:-vocabulary}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./vocabulary-api
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-vocabulary-platform-secret}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api,web}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8380,http://127.0.0.1:8380}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8380,http://127.0.0.1:8380}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-vocabulary}
      POSTGRES_USER: ${POSTGRES_USER:-vocabulary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vocabularychangeme}
      SEED_ON_START: ${SEED_ON_START:-true}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      PORT: 9000
      BMK_JWT_SECRET: ${BMK_JWT_SECRET:-django-insecure-docker-dev-only}
      BMK_JWT_ALGORITHM: ${BMK_JWT_ALGORITHM:-HS256}
      BMK_JWT_AUDIENCE: ${BMK_JWT_AUDIENCE:-}
      BMK_API_BASE_URL: ${BMK_API_BASE_URL:-http://host.docker.internal:8000}
    ports:
      - '${API_PORT:-8300}:9000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./vocabulary-ui
      args:
        VITE_BMK_APP_URL: ${VITE_BMK_APP_URL:-http://localhost:8080}
        VITE_BMK_APP_DOMAIN: ${VITE_BMK_APP_DOMAIN:-localhost}
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8300}
    ports:
      - '${WEB_PORT:-8380}:80'
    depends_on:
      - api

volumes:
  postgres_data:
