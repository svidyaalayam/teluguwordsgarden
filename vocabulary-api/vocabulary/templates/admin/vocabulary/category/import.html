{% extends "admin/base_site.html" %}

{% block content %}
  <div id="content-main">
    <p>Upload a JSON file exported from Word Garden. Existing categories with the same <strong>name</strong> will be overwritten.</p>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <fieldset class="module aligned">
        <div class="form-row">
          <div>
            <label for="id_json_file">JSON file:</label>
            <input id="id_json_file" name="json_file" type="file" accept="application/json,.json" required>
          </div>
        </div>
      </fieldset>
      <div class="submit-row">
        <input type="submit" value="Import categories">
        <a class="button cancel-link" href="{% url 'admin:vocabulary_vocabularycategory_changelist' %}">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
